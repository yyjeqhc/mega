# Mono配置文件示例

# 日志配置
[log]
level = "info"           # 日志级别：trace, debug, info, warn, error
log_path = "./logs"      # 日志存储路径
print_std = true         # 是否将日志输出到标准输出

# Monorepo配置
[monorepo]
repo_path = "./repos"    # Monorepo存储路径
import_dir = "./import"  # Git仓库导入目录

# 数据库配置
[database]
url = "postgres://postgres:password@localhost:5432/mono"  # 数据库连接URL

# OAuth配置（用于用户认证）
[oauth]
ui_domain = "http://localhost:8000"           # UI服务域名
cookie_domain = "localhost"                   # Cookie域
github_client_id = "your_github_client_id"    # GitHub OAuth客户端ID
github_client_secret = "your_github_secret"   # GitHub OAuth客户端密钥

# 认证配置
[authentication]
enable_http_auth = true          # 是否启用HTTP认证
enable_test_user = true          # 是否启用测试用户
test_user_name = "test"          # 测试用户名
test_user_token = "test_token"   # 测试用户令牌

# 大文件存储(LFS)配置
[lfs]
storage_path = "./lfs_storage"   # LFS存储路径

# SSH配置
[lfs.ssh]
http_url = "http://localhost:8000/api/v1"  # SSH服务回退到HTTP的URL